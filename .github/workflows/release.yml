name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
      - id: plan
        run: node scripts/prepare-release.mjs
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/prepare-release.mjs
      - run: npm run check
      - if: runner.os != 'Linux'
        run: npx --no-install playwright test
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx --no-install playwright test
      - name: Build native installers
        run: npx --no-install electron-builder --config .local/builder-release.json --${{ matrix.arch }} --publish never
      - if: runner.os == 'Linux'
        name: Configure packaged Chromium sandbox
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - if: runner.os != 'Linux'
        name: Verify packaged app and native modules
        run: node scripts/smoke-package.mjs "${{ matrix.executable }}"
      - if: runner.os == 'Linux'
        name: Verify packaged app and native modules on Linux
        run: xvfb-run --auto-servernum node scripts/smoke-package.mjs "${{ matrix.executable }}"
      - run: node scripts/validate-release.mjs --artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
      - run: node scripts/prepare-release.mjs
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: artifacts
      - run: node scripts/validate-release.mjs --all
      - name: Publish only the complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
