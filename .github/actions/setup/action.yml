name: FilePilot build environment
description: Install the locked Node dependencies and native Electron test prerequisites.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24.15.0'
        cache: npm
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 libfuse2t64 rpm
    - shell: bash
      run: npm ci --fetch-retries=3
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo chown root:root node_modules/electron/dist/chrome-sandbox
        sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
