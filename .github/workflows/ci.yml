name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Electron workflow (Windows and macOS)
        if: runner.os != 'Linux'
        run: npx playwright test
      - name: Electron workflow (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
