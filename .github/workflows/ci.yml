name: Pull request checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run check
      - if: runner.os != 'Linux'
        run: npx --no-install playwright test
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx --no-install playwright test
